name: build

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - run: dotnet test VictusControl.sln -c Release
      - run: dotnet publish src/VictusControl.Cli -c Release -o dist
      - run: dotnet publish src/VictusControl.App -c Release -o dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create release archive
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: Compress-Archive -Path dist/* -DestinationPath VictusControl-${{ github.ref_name }}.zip

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: VictusControl-*.zip
