name: build-linux

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile-check all Python modules
        run: python3 -m compileall -q src tests
      - name: Run unit and integration test suite
        env:
          PYTHONPATH: src:.
        run: python3 -m unittest discover -s tests -v
      - name: Package Linux distribution tarball
        run: |
          mkdir -p dist/victus-control-linux
          cp -r src systemd desktop pyproject.toml install_linux.sh README.md LICENSE dist/victus-control-linux/
          tar -czf dist/VictusControl-linux-v0.0.3.tar.gz -C dist victus-control-linux
      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: dist/VictusControl-linux-v0.0.3.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-linux
          path: dist
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/VictusControl-linux-*.tar.gz
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
