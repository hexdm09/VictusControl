name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - run: dotnet test VictusControl.sln -c Release
      - run: dotnet publish src/VictusControl.Cli -c Release -o dist
      - run: dotnet publish src/VictusControl.App -c Release -o dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
