name: build-linux

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile-check all Python modules
        run: python3 -m compileall -q src tests
      - name: Run unit and integration test suite
        env:
          PYTHONPATH: src:.
        run: python3 -m unittest discover -s tests -v
